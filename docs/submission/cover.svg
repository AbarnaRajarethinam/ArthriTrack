<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ArthriTrack — AI Healthier Every Day</title>
  <desc id="desc">A 16 by 9 abstract cover illustration for a hand self-care tracking prototype. It lists experimental movement estimates, self-reported context, and appointment preparation. This artwork is not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b252e"/><stop offset=".55" stop-color="#123e46"/><stop offset="1" stop-color="#176c69"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ce3cf" stop-opacity=".95"/><stop offset="1" stop-color="#42a9a1" stop-opacity=".2"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5f4dd"/><stop offset="1" stop-color="#60c6b3"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="220" r="210" fill="#48b5a5" opacity=".16" filter="url(#blur)"/>
  <circle cx="1390" cy="720" r="230" fill="#9ce3cf" opacity=".12" filter="url(#blur)"/>
  <path d="M0 690 C290 590 470 770 760 690 S1280 600 1600 700 V900 H0Z" fill="#071d27" opacity=".35"/>
