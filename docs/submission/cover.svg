    <text x="108" y="320" fill="#f4fbf8" font-size="86" font-weight="700" letter-spacing="-2">ArthriTrack</text>
    <text x="112" y="387" fill="#a9e7d4" font-size="32" font-weight="500">AI Healthier Every Day</text>
    <text x="112" y="446" fill="#e4f2ee" font-size="23">Intelligent support for long-term self-care</text>
    <text x="112" y="502" fill="#b8ceca" font-size="18">Camera-guided hand tracking · personal trends · appointment preparation</text>
    <rect x="112" y="566" width="578" height="1" fill="#c3e7dc" opacity=".3"/>
