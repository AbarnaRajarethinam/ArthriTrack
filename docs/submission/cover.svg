    <circle cx="101" cy="647" r="5" fill="#84d5be"/>
    <text x="112" y="693" fill="#c6ddd6" font-size="18">User-reviewed appointment summary</text>
    <circle cx="101" cy="686" r="5" fill="#84d5be"/>
    <text x="112" y="792" fill="#8da9a5" font-size="15" letter-spacing="1.6">SELF-CARE PROTOTYPE · NOT A DIAGNOSTIC TOOL</text>
  </g>
